name: Build & Release SyncSave

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build SyncSave.exe
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-H windowsgui -s -w" -o SyncSave.exe .
          certutil -hashfile SyncSave.exe SHA256 | findstr /v "hash" | findstr /v "CertUtil" > SyncSave.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncSave-windows-amd64
          path: |
            SyncSave.exe
            SyncSave.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            SyncSave.exe
            SyncSave.exe.sha256
