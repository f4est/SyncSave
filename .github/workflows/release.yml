name: Build & Release SyncSave

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Vet and Test
        run: |
          go vet ./...
          go test -v ./...

      - name: Build SyncSave.exe
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
          CID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          $ldflags = "-H windowsgui -s -w"
          if ($env:CID -and $env:CSEC) {
            $ldflags += " -X syncsave/internal/config.DefaultClientID=$($env:CID) -X syncsave/internal/config.DefaultClientSecret=$($env:CSEC)"
          }
          go build -trimpath -ldflags="$ldflags" -o SyncSave.exe .
          $hash = (Get-FileHash SyncSave.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SyncSave.exe" | Out-File -Encoding ascii SyncSave.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncSave-windows-amd64
          path: |
            SyncSave.exe
            SyncSave.exe.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" SyncSave.exe SyncSave.exe.sha256 --title "SyncSave $tag" --generate-notes
